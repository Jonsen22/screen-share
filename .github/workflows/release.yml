name: Release Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Extract release notes from CHANGELOG.md
        id: extract_notes
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: node scripts/extract-release-notes.mjs "$env:RELEASE_REF_NAME" --include-installer-note --github-output release_notes

      - name: Build Windows installer and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: "screen-share v__VERSION__"
          releaseBody: ${{ steps.extract_notes.outputs.release_notes }}
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
